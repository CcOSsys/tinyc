# tinyc USB stick
set timeout=3
set default=0
insmod all_video
set gfxpayload=keep
set menu_color_normal=light-gray/black
set menu_color_highlight=black/light-cyan
menuentry "tinyc" {
    linux /boot/vmlinuz quiet loglevel=3 panic=10 logo.nologo
    initrd /boot/initrd.gz
}
menuentry "tinyc (safe graphics)" {
    linux /boot/vmlinuz quiet loglevel=3 panic=10 logo.nologo nomodeset vga=791
    initrd /boot/initrd.gz
}
