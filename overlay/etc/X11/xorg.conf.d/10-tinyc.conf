# tinyc graphics: no 3D (Mesa isn't included). The X server picks the driver by itself:
#   a computer with a real graphics driver (Intel...) -> "modesetting": hardware pointer, 60 Hz
#   otherwise -> "fbdev" / "vesa": the basic mode (the CPU draws everything)
# "tinyc (safe graphics)" at boot (nomodeset) always ends up in the basic mode.
Section "Module"
    Disable "glx"
    Disable "glamoregl"
EndSection
Section "ServerFlags"
    Option "AutoAddGPU" "false"
EndSection
